<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>DISCIPLINE 30</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f4f5;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 18px 110px}h1{font-size:29px;letter-spacing:-1px;margin:8px 0}h2{font-size:19px;margin:24px 0 12px}small,.muted{color:#a2a5ae}section,.panel{background:#1b1d22;border:1px solid #292c34;border-radius:20px;padding:18px;margin:12px 0}.eyebrow{font-size:11px;letter-spacing:3px;color:#a9ed76;font-weight:800}.big{font-size:38px;font-weight:800;letter-spacing:-2px}.bar{height:8px;background:#383b42;border-radius:8px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:#a9ed76;transition:width .2s}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:#292c34;border:0;border-radius:12px;padding:12px}button.primary{background:#a9ed76;color:#172013;font-weight:800;width:100%}label.task{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #303239}label.task:last-child{border:0}input[type=checkbox]{width:23px;height:23px;accent-color:#a9ed76;flex-shrink:0}input:not([type=checkbox]),textarea{width:100%;background:#101114;color:white;border:1px solid #393c45;border-radius:10px;padding:12px;margin:6px 0 13px}textarea{min-height:85px}nav{position:fixed;bottom:0;left:0;right:0;background:#1b1d22;border-top:1px solid #303239;display:flex;justify-content:center;padding:8px 0 max(10px,env(safe-area-inset-bottom));z-index:2}nav button{background:none;font-size:11px;min-width:0;flex:1;max-width:88px;padding:8px 2px;color:#a2a5ae}nav button b{display:block;font-size:21px;margin-bottom:3px}nav button.active{color:#a9ed76}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.days{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.day{aspect-ratio:1;display:grid;place-items:center;background:#292c34;border-radius:9px;font-size:13px}.day.now{outline:2px solid #a9ed76}.day.full{background:#a9ed76;color:#101114}.day.part{background:#425b37}.split{display:flex;justify-content:space-between;align-items:center;gap:12px}.hidden{display:none}.stat{font-size:24px;font-weight:750}a{color:#a9ed76}#notice{color:#ffbe79;font-size:13px}nav{overflow-x:auto;justify-content:flex-start}nav button{flex:1 0 65px}select{font:inherit;background:#101114;color:white;padding:10px;border-radius:8px;width:100%;margin:8px 0}input[type=range]{accent-color:#a9ed76}section h2:first-child{margin-top:0}@media(min-width:700px){nav{justify-content:center}main{max-width:680px}}</style><main><div class="eyebrow">ЛИЧНАЯ СИСТЕМА</div><h1>DISCIPLINE 30<span style="color:#a9ed76">.</span></h1><div class="split"><small id="date"></small><button id="prev">‹</button><button id="today">Сегодня</button><button id="next">›</button></div><p id="notice"></p><div id="view"></div></main><nav id="nav"></nav><script>
const key='discipline30-v1';let store;try{store=JSON.parse(localStorage.getItem(key))||{}}catch{store={}};store.days??={};store.start??=iso(new Date());store.goal??=50000;store.initial??=0;const defaults=['Записать все доходы и расходы','Главная задача бизнеса (выявить и выполнить главную задачу на сегодня)','Отложить часть чистой прибыли на погашение долгов','Тренировка или восстановление','Полноценное питание (белок, углеводы, жиры, овощи и вода)','Хороший сон','Подвести итоги дня (запись в дневник)'];const aliases={'Выполнить главную задачу бизнеса':defaults[1],'Проверить долги и обязательные платежи':defaults[2],'Тренировка по плану или восстановление':defaults[3],'Полноценное питание':defaults[4],'Не менее 8 часов сна':defaults[5],'Подвести итоги дня':defaults[6]};function migrate(){if(store.version===2)return;store.habits=[...new Set((store.habits||defaults).filter(h=>h!=='Не брать новые кредиты и микрозаймы').map(h=>aliases[h]||h))];for(const d of Object.values(store.days)){d.checks??={};for(const [a,b] of Object.entries(aliases))if(d.checks[a])d.checks[b]=true;}store.debtRate??=20;store.version=2;}migrate();store.debtRate??=20;store.assets??=0;store.liabilities??=0;store.rating??=316;store.reviews??={};let selected=iso(new Date()),tab=0;const $=x=>document.getElementById(x);function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function shift(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}function save(){try{localStorage.setItem(key,JSON.stringify(store));$('notice').textContent=''}catch{$('notice').textContent='Не удалось сохранить данные в браузере. Сделай резервную копию.'}}function day(){return store.days[selected]??={checks:{},profit:0,expenses:0,returns:0,deposit:0,debt:0,focus:'',journal:'',sleep:'',weight:''}}function num(v){return Number(v)||0}function money(v){return num(v).toLocaleString('ru-RU')+' ₽'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function score(d){return store.habits.filter(h=>d?.checks?.[h]).length}function totals(k){return Object.values(store.days).reduce((a,d)=>a+num(d[k]),0)}function field(k,label,type='number'){return `<label>${label}<input data-field="${k}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(day()[k])}"></label>`}function area(k,label){return `<label>${label}<textarea data-field="${k}">${esc(day()[k])}</textarea></label>`}function training(dt=selected){return Math.round((Date.parse(dt+'T12:00:00Z')-Date.parse('2026-11-26T12:00:00Z'))/86400000)%2===0}function tasks(){return store.habits.map(h=>`<label class="task"><input type="checkbox" data-habit="${esc(h)}" ${day().checks[h]?'checked':''}><span>${esc(h===defaults[3]?(training()?"Силовая тренировка по плану":"День восстановления (прогулка, отдых, без обязательной силовой)"):h)}</span></label>`).join('')}const recipes=[['Роти с курицей и овощами','Роти 1 шт., курица 150 г, овощи, йогурт. Обжарь курицу до готовности, заверни с овощами и соусом.', ['кур','роти','овощ']],['Овсянка с творогом и яблоком','Овсянка 60 г, молоко 200 мл, творог 100–150 г, яблоко. Свари кашу, добавь творог и фрукт.', ['овся','творог','молок','яблок']],['Рис с рыбой и овощами','Рис 70 г сухого, рыба 150–180 г, овощи 200 г. Отвари рис, запеки рыбу до готовности, добавь овощи.', ['рис','рыб','минтай','форель']],['Омлет с сыром и тостом','2–3 яйца, сыр 25 г, овощи, хлеб. Приготовь омлет, подай с тостом и овощами.', ['яй','сыр','хлеб']]];function nutrition(){return `<h2>Питание</h2><section><small>${training()?'Тренировочный день':'День восстановления'}</small><h2>Полноценный рацион</h2><p>Белок в основных приёмах пищи, углеводы для энергии, жиры, овощи и фрукты, вода по жажде. ${training()?'За 1–3 часа до тренировки — привычная еда с белком и углеводами; после — полноценный приём пищи.':'Не урезай питание резко: мышцам нужны энергия и белок для восстановления.'}</p>${area('meals','Что ел сегодня')}${field('calories','Калории (если считаешь)')}${field('protein','Белки, г')}${field('fat','Жиры, г')}${field('carbs','Углеводы, г')}${area('workout','Упражнения, подходы и веса')}${area('savedRecipes','Мои рецепты и список покупок')}${area('ingredients','Какие продукты есть дома?')}<button class="primary" id="recipeButton">Подобрать рецепты</button><div id="recipeResult"></div></section><section><b>Персональная помощь ChatGPT</b><p class="muted">Приложение формирует запрос с учётом режима дня и продуктов. Встроенного ИИ пока нет.</p><button class="primary" id="aiButton">Подготовить запрос для ИИ</button><textarea id="aiPrompt" readonly placeholder="Здесь появится запрос для копирования"></textarea><a href="https://chatgpt.com/" target="_blank" rel="noopener">Открыть ChatGPT и вставить запрос</a></section>`} function render(){let d=day(),s=score(d),p=Math.round(s/Math.max(1,store.habits.length)*100),sum=store.initial+totals('deposit');$('date').textContent=new Date(selected+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});let views=[`<section><small>Дисциплина дня</small><div class="big">${p}%</div><div class="bar"><div style="width:${p}%"></div></div><small>${s} из ${store.habits.length} выполнено</small></section><div class="grid"><section><small>На ноутбук</small><div class="stat">${money(sum)}</div></section><section><small>Чистая прибыль дня</small><div class="stat">${money(d.profit)}</div></section></div><section><small>Режим дня</small><div class="stat">${training()?"Силовая тренировка":"Восстановление"}</div><small>${training()?"Поешь до и после тренировки, не забывай про воду.":"Регулярное питание, лёгкая активность и отдых."}</small></section><h2>Главная задача дня</h2><section>${area('focus','Один конкретный результат')}</section><h2>Ежедневный чек-лист</h2><section>${tasks()}</section>`,`<h2>Деньги</h2><section><small>Накоплено на ноутбук</small><div class="big">${money(sum)}</div><div class="bar"><div style="width:${Math.max(0,Math.min(100,sum/Math.max(1,store.goal)*100))}%"></div></div><small>Цель ${money(store.goal)} · осталось ${money(Math.max(0,store.goal-sum))}</small></section><section>${field('profit','Фактическая чистая прибыль бизнеса, ₽')}${field('expenses','Личные расходы, ₽')}${field('returns','Потери на возвратах (для справки), ₽')}${field('deposit','Отложено на ноутбук, ₽')}${field('debtReserve','Отложено на погашение долгов, ₽')}${field('debt','Фактически погашено долгов, ₽')}<p class="muted">Ориентир на сегодня: ${money(Math.max(0,num(d.profit))*store.debtRate/100)} (${store.debtRate}% прибыли). Отложено за все дни: ${money(totals('debtReserve'))}. Резерв и фактическое погашение не складывай как два расхода.</p><small>Прибыль указывай уже после расходов и возвратов. Не вычитай их дважды.</small></section>`,`<h2>Здоровье и рефлексия</h2><section>${field('sleep','Сон, часов (необязательно)')}${field('sleepQuality','Самочувствие после сна','text')}${field('weight','Вес, кг (необязательно)')}${area('journal','Что получилось? Что помешало? Что изменю завтра?')}</section>`,`<h2>Прогресс</h2><section><small>Старт: ${esc(store.start)}</small><div class="days" style="margin:16px 0">${Array.from({length:30},(_,i)=>{let dt=shift(selected,-29+i),n=score(store.days[dt]);return `<button class="day ${dt===selected?'now':''} ${n===store.habits.length?'full':n?'part':''}" data-date="${dt}">${dt.slice(5).replace("-",".")}</button>`}).join('')}</div><small>Последние 30 дней до выбранной даты. Зелёный — все привычки выполнены. Тёмно-зелёный — частично.</small></section><section><div class="split"><span>Прибыль за все записи</span><b>${money(totals('profit'))}</b></div><hr><div class="split"><span>Погашено долгов</span><b>${money(totals('debt'))}</b></div><hr><div class="split"><span>Личные расходы</span><b>${money(totals('expenses'))}</b></div></section>`,`<h2>Настройки</h2><section><label>Дата начала<input id="start" type="date" value="${esc(store.start)}"></label><label>Цель накоплений<input id="goal" type="number" value="${store.goal}"></label><label>Накоплено до старта<input id="initial" type="number" value="${store.initial}"></label><label>Доля свободной прибыли на долги, %<input id="debtRate" type="number" min="0" max="100" value="${store.debtRate}"></label><label>Привычки (одна на строку)<textarea id="habits">${esc(store.habits.join('\n'))}</textarea></label><button class="primary" id="settingsSave">Сохранить настройки</button></section><section><button id="export">Скачать резервную копию</button><p><small>Данные хранятся только в этом браузере. При очистке данных они могут исчезнуть.</small></p><label>Восстановить из копии<input id="import" type="file" accept="application/json"></label></section>`,nutrition(),development(),reports()];$('view').innerHTML=views[tab];$('nav').innerHTML=['⌂|Главная','₽|Финансы','✎|Дневник','▦|Прогресс','⚙|Настройки','🍴|Питание','↗|Рост','⇧|Отчёт'].map((v,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}"><b>${v.split('|')[0]}</b>${v.split('|')[1]}</button>`).join('');document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{d[el.dataset.field]=el.type==='number'?num(el.value):el.value;save()});document.querySelectorAll('[data-habit]').forEach(el=>el.onchange=()=>{d.checks[el.dataset.habit]=el.checked;save();render()});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=num(el.dataset.tab);render()});document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{selected=el.dataset.date;tab=0;render()});if(tab===6){document.querySelectorAll('[data-profile]').forEach(el=>el.oninput=()=>{store[el.dataset.profile]=num(el.value);save();$('capital').textContent=money(store.assets-store.liabilities)});document.querySelectorAll('[data-life]').forEach(el=>el.oninput=()=>{(day().life??={})[el.dataset.life]=num(el.value);el.nextElementSibling.textContent=el.value+'/10';save()});}if(tab===7){$('reportPeriod').onchange=()=>{$('reportText').value=report(num($('reportPeriod').value))};$('copyReport').onclick=async()=>{let el=$('reportText');try{await navigator.clipboard.writeText(el.value);$('copyReport').textContent='Скопировано'}catch{el.select();alert('Выделенный текст можно скопировать вручную')}};}if(tab===5){$('recipeButton').onclick=()=>{const r=recipes.filter(r=>!d.ingredients||r[2].some(x=>d.ingredients.toLowerCase().includes(x)));$('recipeResult').innerHTML=(r.length?r:recipes).map(r=>`<section><b>${esc(r[0])}</b><p>${esc(r[1])}</p></section>`).join('')};$('aiButton').onclick=()=>{const prompt='Составь полноценный рацион и 2–3 интересных рецепта. Мне 19 лет, силовые через день. Сегодня '+(training()?'тренировка':'восстановление')+'. Доступные продукты: '+(d.ingredients||'уточни у меня')+'. Уже ел: '+(d.meals||'не указано')+'. Цель: восстановление и сохранение мышц. Укажи порции, примерные КБЖУ и способы приготовления.';$('aiPrompt').value=prompt;$('aiPrompt').select();if(navigator.clipboard)navigator.clipboard.writeText(prompt).catch(()=>{});};}if(tab===4){$('settingsSave').onclick=()=>{store.start=$('start').value||store.start;store.goal=Math.max(1,num($('goal').value));store.initial=num($('initial').value);store.debtRate=Math.max(0,Math.min(100,num($('debtRate').value)));let h=[...new Set($('habits').value.split('\n').map(x=>x.trim()).filter(Boolean))];if(h.length)store.habits=h;save();render()};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store)],{type:'application/json'}));a.download='discipline30-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.days||!Array.isArray(x.habits)||!x.habits.length||!x.start)throw Error();if(confirm('Заменить текущие данные резервной копией?')){store=x;migrate();save();render()}}catch{alert('Не удалось прочитать резервную копию')}}}}const lifeAreas=['Финансы','Бизнес','Здоровье','Дисциплина','Знания','Окружение','Отдых','Эмоции'];
function development(){let d=day();return `<h2>Развитие</h2><section><small>Личный капитал</small><div class="big" id="capital">${money(store.assets-store.liabilities)}</div>${[['assets','Активы, ₽'],['liabilities','Все обязательства, ₽'],['rating','Рейтинг НБКИ']].map(([k,l])=>`<label>${l}<input type="number" min="0" data-profile="${k}" value="${esc(store[k])}"></label>`).join('')}<small>Введи актуальные остатки вручную. Не учитывай один актив дважды.</small></section><section>${field('workHours','Работа, часов')}${field('learning','Обучение, минут')}${area('skill','Чему научился?')}${area('mistake','Ошибка и урок')}${area('win','Достижение')}${area('purchase','Покупка на обдумывание 48 часов (дата, цена, причина)')}</section><section><h2>Колесо жизни</h2><small>Заполняй раз в неделю; пустые оценки не учитываются.</small>${lifeAreas.map(a=>`<div class="split"><label>${a}<input type="range" min="0" max="10" data-life="${a}" value="${d.life?.[a]??5}"></label><span>${d.life?.[a]===undefined?'—':d.life[a]+'/10'}</span></div>`).join('')}${area('review','Что изменить на следующей неделе?')}</section>`}
function report(n){let dates=Object.keys(store.days).filter(k=>k<=selected&&(n===0||k>=shift(selected,1-n))).sort();let ds=dates.map(k=>store.days[k]);let sum=k=>ds.reduce((a,d)=>a+num(d[k]),0);return ['DISCIPLINE 30 — '+(n? n+' дн.':'Вся история')+' до '+selected,'Записей: '+dates.length,'Прибыль: '+money(sum('profit')),'Личные расходы: '+money(sum('expenses')),'Потери на возвратах (справочно): '+money(sum('returns')),'На ноутбук: '+money(store.initial+totals('deposit')),'Отложено на долги за период: '+money(sum('debtReserve')),'Погашено за период: '+money(sum('debt')),'Капитал (по введённым остаткам): '+money(store.assets-store.liabilities),'НБКИ: '+store.rating,...dates.map(k=>{let d=store.days[k];return k+' | привычки '+score(d)+'/'+store.habits.length+' | '+(training(k)?'тренировка':'восстановление')+' по плану | задача: '+(d.focus||'—')+' | сон: '+(d.sleep||'—')+' | питание: '+(d.meals||'—')+' | дневник: '+(d.journal||'—')+' | урок: '+(d.mistake||'—')+' | достижение: '+(d.win||'—')+' | колесо: '+JSON.stringify(d.life||{})}), 'Проанализируй результаты, риски и предложи конкретные следующие шаги. Не считай отсутствующие данные нулевыми результатами.'].join('\n')}
function reports(){return `<h2>Отчёт для ChatGPT</h2><section><label>Период<select id="reportPeriod"><option value="1">День</option><option value="7">Неделя</option><option value="30">Месяц</option><option value="0">Вся история</option></select></label><textarea id="reportText" readonly style="min-height:280px">${esc(report(1))}</textarea><button class="primary" id="copyReport">Скопировать отчёт</button><p><a href="https://chatgpt.com/" target="_blank" rel="noopener">Открыть ChatGPT</a></p><small>Проверь личные данные перед отправкой.</small></section>`}
$('prev').onclick=()=>{selected=shift(selected,-1);render()};$('next').onclick=()=>{selected=shift(selected,1);render()};$('today').onclick=()=>{selected=iso(new Date());render()};render();save();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
